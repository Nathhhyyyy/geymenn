<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZamboMart Live - DTI SRP & Radix Sort Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <h1>ZamboMart Live 🛒</h1>
        <p>Zamboanga City DTI Suggested Retail Price (SRP) Tracker & Radix Sort Engine</p>
    </header>

    <main class="container">
        <section class="controls-panel">
            <h2>Market & Sort Controls</h2>
            <button id="liveSyncBtn" class="btn primary">🔄 Fetch Live DTI Prices</button>
            <button id="sortBtn" class="btn secondary">📊 Radix Sort by Price (Centavos)</button>
        </section>

        <section class="display-panel">
            <div class="panel-header">
                <h2>Zamboanga City Basic Commodities</h2>
                <span id="sortStatus" class="status-badge">Connecting to backend...</span>
            </div>
            <div id="stationList" class="station-grid">
                <!-- Dynamic commodity cards will render here -->
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 ZamboMart Live · Zamboanga City DTI Commodity Tracker</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
